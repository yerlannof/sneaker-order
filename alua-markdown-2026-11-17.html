:root{--bg:#F3F5F6;--surface:#FFFFFF;--sunk:#E9EDF0;--ink:#16212B;--muted:#5A6874;--line:#D8DFE4;--accent:#0B6B6B;--accent-soft:#DCEDED;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
b,.n{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.in{max-width:860px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{font-size:20px;line-height:1.15;margin:0;font-weight:750}
#sync{font-size:12.5px;color:var(--good);text-align:right;flex:0 0 auto}
#sync.error{color:var(--bad)}
#retry{font:inherit;font-size:13px;margin:6px 0 0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:14.5px;font-weight:600;white-space:nowrap;padding:9px 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer}

.note{background:var(--accent-soft);border-radius:12px;padding:11px 13px;font-size:14px}
.note p{margin:0 0 6px}.note p:last-child{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}

.card.done{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ph{padding:0;border:0;background:#fff;border-radius:10px;width:112px;height:112px;overflow:hidden;cursor:zoom-in;display:block}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph.none{background:var(--sunk);cursor:default}
.t{font-weight:650;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.a{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.a a{color:var(--accent);text-decoration:none;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.cold{background:var(--cold-soft);color:var(--cold)}

.facts div{min-width:0}
.facts b{color:var(--ink);font-weight:600}
.chart{grid-column:1/-1}
.chart .cap{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:58px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;background:var(--bar);border-radius:3px 3px 0 0;min-height:1px}
.bar.sp i{background:var(--bar-hi)}
.bar em{font-style:normal;font-size:10.5px;color:var(--ink);line-height:1.2}
.mon{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10.5px;color:var(--muted);text-align:center}
.why{grid-column:1/-1;font-size:13.5px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.why b{color:var(--ink)}
.why ul{margin:4px 0 0;padding-left:18px}
.pick{grid-column:1/-1;border-top:1px solid var(--line);margin:2px -10px -10px;padding:10px 12px 12px;border-radius:0 0 13px 13px}
.card.done .pick{background:var(--accent-soft)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{font:inherit;font-size:14px;font-weight:600;min-width:52px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative}

.step.low{color:var(--bad)}
.step[aria-pressed="true"].low{background:var(--bad);border-color:var(--bad);color:#fff}
.step:disabled{opacity:.5;cursor:default}
.result{font-size:13.5px;margin-top:7px;color:var(--muted)}
.result b{color:var(--ink)}
.result .bad{color:var(--bad);font-weight:600}
#empty{color:var(--muted);text-align:center;padding:30px 0}
dialog{border:0;border-radius:16px;padding:14px;max-width:min(92vw,520px);background:#fff;color:#15202A}

.foot{color:var(--muted);font-size:12.5px;padding-top:8px}

    }
    const c = row.meta.choices || {};
    if (Array.isArray(c) || typeof c !== 'object' || Object.values(c).some(v => !STEPS.includes(v))) {blocked = true; throw new Error('Не удалось прочитать выбор. Сохранение остановлено.');}
    return row;
  }
  async function read() {
    const rows = await request('GET', {id: 'eq.' + CONFIG.progress_id, select: 'id,status,meta,updated_at'});
    if (rows.length !== 1) throw new Error('Общий список пока недоступен');
    return validate(rows[0]);
  }
  function accept(row) {chosen = {...row.meta.choices}; ready = true; persist(); draw();}
  async function sync() {
    if (working || blocked) return;
    working = true;
    try {
      let row = await read(); accept(row);
      for (let attempt = 0; Object.keys(pending).length && attempt < 5; attempt++) {
        status('Сохраняем…');
        const sent = JSON.parse(JSON.stringify(pending)), c = {...row.meta.choices};
        for (const [id, edit] of Object.entries(sent)) { if (edit.value === null) delete c[id]; else c[id] = edit.value; }
        const updated = new Date(Math.max(Date.now(), Date.parse(row.updated_at) + 1)).toISOString();
        const result = await request('PATCH', {id: 'eq.' + CONFIG.progress_id, status: 'eq.draft', updated_at: 'eq.' + row.updated_at},
          {meta: {...row.meta, choices: c}, updated_at: updated});
        if (!result.length) {row = await read(); accept(row); continue;}
        validate(result[0]);
        row = await read();
        for (const [id, edit] of Object.entries(sent)) {
          const got = id in row.meta.choices ? row.meta.choices[id] : null;
          if (got === edit.value && JSON.stringify(pending[id]) === JSON.stringify(edit)) delete pending[id];
        }
        accept(row);
      }
      if (Object.keys(pending).length) throw new Error('Есть несохранённый выбор');
      status('Выбор сохранён');
    } catch (error) {
      persist();
      status(blocked ? error.message : Object.keys(pending).length ? 'Не сохранено · копия на устройстве' : 'Не удалось загрузить выбор', true);
      draw();
    } finally {working = false;}
  }
  function set(id, v) {
    if (!ids.has(id) || !ready || blocked) return;
    pending[id] = {value: v};
  }
  const tag = t => `<span class="tag ${t[0]}">${esc(t[1])}</span>`;
  function tagsOf(i) {
    const t = [];
    if (i.rec === 0) t.push(['good', i.cur_pct ? 'скидку не добавлять' : 'подождать']);
    else t.push(['warn', 'предлагаю −' + i.rec + '%']);
    if (i.cur_pct) t.push(['bad', 'уже −' + i.cur_pct + '%']);
    if (i.holes) t.push(['cold', 'нет размеров: ' + i.holes]);
    if (i.spring >= 1) t.push(['', 'весной ~' + n0(i.spring) + ' пар/мес']);
    if (i.season) t.push(['', 'метка: ' + i.season]);
    return t.map(tag).join('');
  }
  function chart(i) {
    const mx = Math.max(1, ...i.mon);
    const bars = i.mon.map((v, k) => `<div class="bar${['мар','апр','май'].includes(PACKAGE.months[k]) ? ' sp' : ''}"><em>${v || ''}</em><i style="height:${Math.round(100 * v / mx)}%"></i></div>`).join('');
    return `<div class="chart"><div class="cap">Продано по месяцам за год (платные пары, весна выделена)</div><div class="bars">${bars}</div><div class="mon">${PACKAGE.months.map(m => `<span>${m}</span>`).join('')}</div></div>`;
  }
  function card(i) {
    const st = [['Москва', i.st.m], ['ЦУМ', i.st.c], ['Аружан', i.st.a], ['склад', i.st.w]].filter(x => x[1]).map(x => x[0] + ' ' + x[1]).join(', ');
    const site = i.on_site ? `<a href="${esc(CONFIG.site + i.handle)}" target="_blank" rel="noopener">на сайте ↗</a>` : '<span>на сайте нет</span>';
    const price = i.cur_pct ? `<b>${n0(i.now)} ₸</b> (обычная ${n0(i.reg)}, уже −${i.cur_pct}%)` : `<b>${n0(i.reg)} ₸</b>`;
    const margin = i.cost ? ` · закуп ${n0(i.cost)} ₸, наценка ×${(i.now / i.cost).toFixed(1)}` : ' · закуп не указан';
    const steps = STEPS.map(p => {
      const low = i.cost && p && priceAt(i, p) < i.cost * 1.05;
      return `<button class="step${p === i.rec ? ' rec' : ''}${low ? ' low' : ''}" data-id="${esc(i.id)}" data-p="${p}" aria-pressed="false">${p ? '−' + p + '%' : 'Не трогать'}</button>`;
    }).join('');
    return `<article class="card" id="card-${esc(i.id)}" hidden>
      <button class="ph none" data-photo="${esc(i.a)}" aria-label="Увеличить фото"><img data-a="${esc(i.a)}" alt="" loading="lazy"></button>
      <div><div class="t">${esc(i.n)}</div><div class="a"><span>арт. ${esc(i.a)}</span>${site}</div><div class="tags">${tagsOf(i)}</div></div>
      <div class="facts">
        <div>Остаток <b>${pairs(i.q)}</b><br>${esc(st)}</div>
        <div>Размеры<br><b>${esc(i.sizes)}</b></div>
        <div>Продано: 14 дн <b>${i.p14}</b> · 30 дн <b>${i.p30}</b> · 90 дн <b>${i.p90}</b> · год <b>${i.p365}</b>${i.g30 ? ` · подарков за 30 дн ${i.g30}` : ''}</div>
        <div>Последний приход <b>${fmtd(i.last)}</b> (${days(i.last_age)} назад): пришло ${i.last_qty}, продано с тех пор <b>${i.since}</b></div>
        <div>Первый приход ${fmtd(i.first)} (${days(i.first_age)}), всего пришло ${i.total_in}</div>
        <div>Цена ${price}${margin}${i.months !== null ? `<br>Запаса при нынешнем темпе: <b>${i.months >= 24 ? 'больше 2 лет' : n0(i.months) + ' мес.'}</b>` : '<br>Запаса: <b>продаж за месяц нет</b>'}</div>
      </div>
      ${chart(i)}
      <div class="why"><b>Почему так:</b><ul>${i.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
      <div class="pick"><div class="steps">${steps}</div><div class="result"></div></div>
    </article>`;
  }
  $('tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t.id}">${esc(t.title)} <span>${items.filter(i => i.tab === t.id).length}</span></button>`).join('');
  $('list').innerHTML = items.map(card).join('');
  $('foot').textContent = `Остатки и цены МойСклада на ${PACKAGE.asof}, продажи по ${PACKAGE.sales_to} включительно. Подарки акции в продажи не входят. Samba (B) не включена: решено не трогать до весны. Puma, New Balance, Asics не включены.`;
  $('list').addEventListener('click', e => {
    const b = e.target.closest('.step');
    if (b) {
      const id = b.dataset.id, p = +b.dataset.p;
      set(id, value(id) === p ? null : p); persist(); draw(); status('Сохраняем…'); sync(); return;
    }
    const a = e.target.closest('[data-photo]')?.dataset.photo; if (!a || !PHOTOS[a]) return;
    $('large-photo').src = 'data:image/jpeg;base64,' + PHOTOS[a]; $('photo-label').textContent = byId[a]?.n + ' · арт. ' + a; $('photo-dialog').showModal();
  });
  $('close-photo').onclick = () => $('photo-dialog').close();
  $('photo-dialog').onclick = e => {if (e.target === $('photo-dialog')) $('photo-dialog').close();};
  $('tabs').addEventListener('click', e => {const t = e.target.closest('[data-tab]')?.dataset.tab; if (!t) return; tab = t; persist(); draw(); window.scrollTo({top: 0});});
  $('filters').addEventListener('click', e => {const f = e.target.closest('[data-f]')?.dataset.f; if (!f) return; filter[tab] = f; draw();});
  $('accept').onclick = () => {for (const i of items) if (i.tab === tab && passes(i) && value(i.id) === null) set(i.id, i.rec); persist(); draw(); status('Сохраняем…'); sync();};
  $('retry').onclick = sync;
  window.addEventListener('online', sync);
  window.addEventListener('beforeunload', e => {if (Object.keys(pending).length) {e.preventDefault(); e.returnValue = '';}});
  document.addEventListener('visibilitychange', () => {if (!document.hidden) sync();});
  setInterval(() => {if (!document.hidden) sync();}, 20000);
  draw(); sync();
  fetch(CONFIG.photos, {cache: 'force-cache'}).then(r => r.ok ? r.json() : {}).then(p => {
    PHOTOS = p;
    document.querySelectorAll('img[data-a]').forEach(img => {const b = p[img.dataset.a]; if (b) {img.src = 'data:image/jpeg;base64,' + b; img.parentElement.classList.remove('none');}});
  }).catch(() => {});
})();
</script></body></html>
