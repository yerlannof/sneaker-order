<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e4e2dc;--accent:#1f5f4a;--accent-ink:#fff;--warn:#a5481b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}

.art{font-weight:700;font-size:13px;color:var(--muted)}
.name{font-weight:600}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btns button{border:1px solid var(--line);background:#fafaf8;border-radius:10px;padding:11px 6px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.btns button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cmt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar .info{font-size:14px}
.bar .st{font-size:13px;color:var(--muted)}
.bar .st.err{color:var(--warn)}
#save{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}
#save:disabled{opacity:.6}

const SUPA = {url: "https://pfnmrjbnvczymflvuvsc.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbm1yamJudmN6eW1mbHZ1dnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MjIwNTIsImV4cCI6MjA4ODQ5ODA1Mn0.g91-jKE6_pmi8eI_f_IwMe1hs0DPMk1icafqqOYiKdY"};
const OPTS = [['fur','Мех'],['natural_fur','Натуральный мех'],['thermo','Термо'],['none','Без утепления']];
const LS = 'winter_insulation_draft_v1';
let marks = {};  // article -> {insulation, comment}
let dirty = false;
const $ = id => document.getElementById(id);
function hdr(){ return {apikey: SUPA.key, Authorization: 'Bearer ' + SUPA.key, 'Content-Type': 'application/json'}; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  $('grid').innerHTML = DATA.items.map(it => {
    const m = marks[it.article] || {};
    const s = it.stores;
    return `<article class="card ${m.insulation ? 'done' : ''}" data-a="${it.article}">
      <div class="ph">${it.photo ? `<img src="${it.photo}" alt="${esc(it.name)}" loading="lazy">` : 'Фото в МойСкладе нет'}</div>
      <div class="body">
        <div class="art">${it.article}</div>
        <div class="name">${esc(it.name)}</div>
        <div class="stock">Остаток ${s.all} пар: Москва ${s.msk}, ЦУМ ${s.tsum}, Аружан ${s.aru}</div>
        <div class="btns">${OPTS.map(([k, l]) => `<button type="button" data-k="${k}" class="${m.insulation === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <input class="cmt" placeholder="Комментарий, если нужно" value="${esc(m.comment || '')}">
      </div></article>`;
  }).join('');
  count();
}
function count(){
  const n = DATA.items.filter(it => (marks[it.article] || {}).insulation).length;
  $('count').textContent = `Отмечено ${n} из ${DATA.items.length}`;
}
function keep(){ dirty = true; try { localStorage.setItem(LS, JSON.stringify(marks)); } catch(e) {} $('st').textContent = 'Есть несохранённые отметки'; $('st').className = 'st'; }
$('grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const a = b.closest('.card').dataset.a, k = b.dataset.k;
  marks[a] = marks[a] || {};
  marks[a].insulation = marks[a].insulation === k ? null : k;
  const card = b.closest('.card');
  card.querySelectorAll('button[data-k]').forEach(x => x.classList.toggle('on', x.dataset.k === marks[a].insulation));
  card.classList.toggle('done', !!marks[a].insulation);
  count(); keep();
});
$('grid').addEventListener('input', e => {
  if (!e.target.classList.contains('cmt')) return;
  const a = e.target.closest('.card').dataset.a;
  marks[a] = marks[a] || {}; marks[a].comment = e.target.value; keep();
});
async function load(){
  try {
    const r = await fetch(`${SUPA.url}/rest/v1/orders?id=eq.${encodeURIComponent(DATA.row_id)}&select=items,updated_at`, {headers: hdr()});
    if (r.ok) { const rows = await r.json(); if (rows.length) for (const it of rows[0].items || []) if (it.insulation || it.comment) marks[it.article] = {insulation: it.insulation || null, comment: it.comment || ''}; }
  } catch(e) {}
  try { const local = JSON.parse(localStorage.getItem(LS) || 'null'); if (local) { for (const [a, m] of Object.entries(local)) marks[a] = m; dirty = true; } } catch(e) {}
  render();
  $('st').textContent = dirty ? 'Есть несохранённые отметки' : '';
}
$('save').addEventListener('click', async () => {
  $('save').disabled = true; $('st').textContent = 'Сохраняю...'; $('st').className = 'st';
  const items = DATA.items.map(it => ({article: it.article, name: it.name, insulation: (marks[it.article] || {}).insulation || null, comment: (marks[it.article] || {}).comment || ''}));
  const body = {id: DATA.row_id, status: 'draft', items, updated_at: new Date().toISOString()};
  try {
    const r = await fetch(`${SUPA.url}/rest/v1/orders`, {method: 'POST', headers: {...hdr(), Prefer: 'resolution=merge-duplicates'}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    dirty = false; try { localStorage.removeItem(LS); } catch(e) {}
    const t = new Date(); $('st').textContent = `Сохранено в ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  } catch(e) { $('st').textContent = 'Не сохранилось, проверьте интернет и нажмите ещё раз'; $('st').className = 'st err'; }
  $('save').disabled = false;
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
load();
