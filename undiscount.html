<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Снять скидки перед 1+1=3</title><style>
:root{--bg:#f6f7f9;--card:#fff;--b:#e5e7eb;--t1:#111;--t2:#666;--red:#dc2626;--org:#ea580c;--yel:#ca8a04;--gray:#6b7280;--green:#059669}
*{box-sizing:border-box}body{font-family:-apple-system,Inter,sans-serif;background:var(--bg);margin:0;padding:10px;color:var(--t1)}
h1{font-size:18px;margin:4px 0}.sub{color:var(--t2);font-size:12px;margin-bottom:8px}
.warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:10px}
.bar{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:10;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{padding:7px 11px;border-radius:20px;border:1px solid var(--b);background:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:#111;color:#fff;border-color:#111}
.save{margin-left:auto;background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer}
.card{background:var(--card);border:1px solid var(--b);border-radius:12px;margin:8px 0;padding:10px;display:flex;gap:10px}
.card.rm{background:#f0fdf4;border-color:#86efac}
.ph{width:78px;height:78px;object-fit:cover;border-radius:8px;flex-shrink:0}
.noph{width:78px;height:78px;border-radius:8px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;flex-shrink:0;text-align:center}
.body{flex:1;min-width:0}
.nm{font-weight:700;font-size:13px;line-height:1.2}.art{color:#0a7;font-size:11px}
.tier{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-top:2px}
.CRIT{background:#fef2f2;color:var(--red)}.IMP{background:#fff7ed;color:var(--org)}.HOT{background:#fefce8;color:var(--yel)}.OPT{background:#f3f4f6;color:var(--gray)}
.px{margin:5px 0;font-size:14px}.px s{color:#999}.px b{color:var(--org)}.px .arw{color:#999}
.meta{font-size:11px;color:var(--t2)}.meta .bad{color:var(--red);font-weight:700}
.act{display:flex;gap:6px;margin-top:7px}
.btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--b);background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.btn.rmon{background:var(--red);color:#fff;border-color:var(--red)}
.btn.keepon{background:#111;color:#fff;border-color:#111}
.empty{color:#999;padding:24px;text-align:center}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:99}
</style></head><body>
<h1>🚫 Снять скидки перед акцией 1+1=3</h1>
<div class="sub" id="sub">загрузка…</div>
<div class="warn">Под 1+1=3 магазин дарит самый дешёвый из 3 товаров (его полный себес). У товаров со скидкой убыток удваивается. Отметь «убрать скидку» — вернём изначальную цену. 🟢 зелёные = помечены к снятию. Рекомендованные (🔴🟠🟡) уже предвыбраны.</div>
<div class="bar">
<button class="tab" data-f="all" onclick="setF('all',this)">Все</button>
<button class="tab active" data-f="CRIT" onclick="setF('CRIT',this)">🔴 Критично</button>
<button class="tab" data-f="IMP" onclick="setF('IMP',this)">🟠 Важно</button>
<button class="tab" data-f="HOT" onclick="setF('HOT',this)">🟡 Хиты</button>
<button class="tab" data-f="OPT" onclick="setF('OPT',this)">⚪ По желанию</button>
<button class="tab" data-f="rm" onclick="setF('rm',this)">✅ К снятию</button>
<button class="save" onclick="save()">💾 Сохранить</button>
</div>
<div id="grid"></div>
<div id="toast"></div>
<script>
const SB_URL='https://pfnmrjbnvczymflvuvsc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbm1yamJudmN6eW1mbHZ1dnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MjIwNTIsImV4cCI6MjA4ODQ5ODA1Mn0.g91-jKE6_pmi8eI_f_IwMe1hs0DPMk1icafqqOYiKdY';
const SBH={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const ORDER='UNDISCOUNT-001';
let ITEMS=[],PH={},F='CRIT',DEC={};
function fmt(n){return (n||0).toLocaleString('ru-RU')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
async function load(){
  ITEMS=await (await fetch('undiscount_lite.json')).json();
  PH=await (await fetch('undiscount_photos.json')).json();
  // дефолт: рекомендованные предвыбраны
  ITEMS.forEach(i=>DEC[i.article]=i.recommend_remove);
  // подтянуть сохранённое из Supabase
  try{
    const r=await fetch(SB_URL+'/rest/v1/orders?id=eq.'+ORDER+'&select=items',{headers:SBH});
    const d=await r.json();
    if(d[0]&&d[0].items)d[0].items.forEach(x=>{if(x.article in DEC)DEC[x.article]=!!x.remove_discount})
  }catch(e){}
  render()
}
function setF(f,b){F=f;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');render()}
function toggle(art){DEC[art]=!DEC[art];render()}
function render(){
  let list=ITEMS.filter(i=> F==='all'?true : F==='rm'?DEC[i.article] : i.tier===F);
  const nRm=ITEMS.filter(i=>DEC[i.article]).length;
  document.getElementById('sub').innerHTML='Всего на скидке: <b>'+ITEMS.length+'</b> · помечено к снятию: <b>'+nRm+'</b> · показано: '+list.length;
  document.getElementById('grid').innerHTML = list.length? list.map(card).join('') : '<div class="empty">пусто</div>';
}
function card(i){
  const rm=DEC[i.article];
  const p=PH[i.article];
  const img=p?'<img class="ph" src="data:image/jpeg;base64,'+p+'">':'<div class="noph">'+i.article+'</div>';
  const belowCost = i.disc_price <= i.cost*1.1;
  const marg = i.margin>=999?'':(' · маржа '+i.margin+'%');
  const lossTxt = i.loss_per_unit>0? '<span class="bad">под акцией −'+fmt(i.loss_per_unit)+'₸/шт ниже себеса</span>' : (belowCost?'<span class="bad">тонкая маржа</span>':'');
  const st='М'+i.m+' Ц'+i.t+' А'+i.a+(i.w?' Скл'+i.w:'');
  return '<div class="card '+(rm?'rm':'')+'" id="c_'+i.article+'">'+img+'<div class="body">'+
    '<div class="nm">'+i.name+'</div><div class="art">'+i.article+'</div>'+
    '<span class="tier '+i.tier+'">'+i.tname+'</span>'+
    '<div class="px"><s>'+fmt(i.orig)+'</s> <span class="arw">→</span> <b>'+fmt(i.disc_price)+'</b> <span style="color:#999">(−'+i.disc+'%)</span></div>'+
    '<div class="meta">себес '+fmt(i.cost)+marg+' · сток '+i.stock+' ('+st+') · '+i.s30+'/мес<br>'+lossTxt+'</div>'+
    '<div class="act">'+
      '<button class="btn '+(rm?'rmon':'')+'" onclick="setD(\''+i.article+'\',true)">❌ Убрать → '+fmt(i.orig)+'</button>'+
      '<button class="btn '+(!rm?'keepon':'')+'" onclick="setD(\''+i.article+'\',false)">оставить</button>'+
    '</div></div></div>';
}
function setD(art,v){
  DEC[art]=v;
  var el=document.getElementById('c_'+art);
  if(el){
    el.classList.toggle('rm',v);
    var btns=el.querySelectorAll('.btn');
    if(btns.length===2){
      btns[0].className='btn'+(v?' rmon':'');
      btns[1].className='btn'+(!v?' keepon':'');
    }
  }
  // обновить счётчик и вкладку «К снятию» без полной перерисовки
  var nRm=ITEMS.filter(function(i){return DEC[i.article]}).length;
  var sub=document.getElementById('sub');
  if(sub)sub.innerHTML='Всего на скидке: <b>'+ITEMS.length+'</b> · помечено к снятию: <b>'+nRm+'</b>';
  // если открыта вкладка «К снятию» и сняли галку — убрать карточку из вида
  if(F==='rm' && !v && el){el.style.display='none'}
}
async function save(){
  const items=ITEMS.map(i=>({article:i.article,name:i.name,orig:i.orig,disc_price:i.disc_price,tier:i.tier,remove_discount:!!DEC[i.article]}));
  try{
    let r=await fetch(SB_URL+'/rest/v1/orders?id=eq.'+ORDER,{method:'PATCH',headers:{...SBH,Prefer:'return=minimal'},body:JSON.stringify({items,updated_at:new Date().toISOString()})});
    if(r.status===404||r.status===406){await fetch(SB_URL+'/rest/v1/orders',{method:'POST',headers:{...SBH,Prefer:'return=minimal'},body:JSON.stringify({id:ORDER,status:'draft',items})})}
    else if(!r.ok)throw new Error(r.status);
    toast('✓ сохранено ('+items.filter(x=>x.remove_discount).length+' к снятию)')
  }catch(e){toast('⚠️ не сохранилось ('+e.message+')')}
}
load();
</script></body></html>
