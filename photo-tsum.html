<style>
:root{--bg:#f8f9fb;--card:#fff;--border:#e8ecf1;--text:#1a1d23;--text2:#6b7280;--text3:#9ca3af;
--blue:#3b82f6;--blue-light:#eff6ff;--green:#10b981;--green-light:#ecfdf5;--orange:#f59e0b;--orange-light:#fffbeb;
--radius:14px;--radius-sm:8px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:70px;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:100;}
.header h1{font-size:18px;font-weight:800;letter-spacing:-0.4px;}
.header .sub{font-size:12px;color:var(--text2);margin-top:2px;}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 0;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 8px;text-align:center;}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.stat .l{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}
.stat.ok .n{color:var(--green);}
.bar{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
.tabs{display:flex;gap:6px;}
.tab{padding:9px 15px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;}
.tab.active{background:var(--text);color:#fff;border-color:var(--text);}
.search{flex:1;min-width:120px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;}
.actions{display:flex;gap:8px;margin-bottom:10px;}
.btn{padding:10px 14px;border-radius:var(--radius-sm);border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-x{background:var(--green);color:#fff;}
.btn-r{background:var(--card);color:var(--text2);border:1px solid var(--border);}
.list{display:flex;flex-direction:column;gap:9px;}
.row{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;gap:13px;align-items:flex-start;cursor:pointer;user-select:none;transition:.12s;}
.row:active{transform:scale(.99);}
.row.done{background:var(--green-light);border-color:var(--green);}
.cb{width:34px;height:34px;flex:0 0 34px;border:2.5px solid var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-top:2px;}
.row.done .cb{background:var(--green);border-color:var(--green);}
.num{font-size:13px;color:var(--text3);font-weight:700;flex:0 0 24px;text-align:center;margin-top:7px;}
.info{flex:1;min-width:0;}
.art{font-size:18px;font-weight:800;letter-spacing:-0.3px;}
.row.done .art{text-decoration:line-through;color:var(--text2);}
.nm{font-size:13px;color:var(--text2);margin:1px 0 7px;}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.t{font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;}
.t-cum{background:var(--orange-light);color:var(--orange);}
.t-price{background:#f3f4f6;color:var(--text);}
.sizes{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;}
.sz{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;background:#eef1f5;color:var(--text);}
.lnk{font-size:12px;color:var(--blue);text-decoration:none;font-weight:600;margin-top:8px;display:inline-block;}
.empty{text-align:center;color:var(--text3);padding:40px;font-size:14px;}
.hint{font-size:12px;color:var(--text3);text-align:center;margin:2px 0 12px;}
</style>
</head>

</div>

let TAB='cum';
const KEY='photo_tsum_shoes_done';
const done=JSON.parse(localStorage.getItem(KEY)||'{}');
function setTab(t){TAB=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();}
function toggle(a){done[a]=!done[a];localStorage.setItem(KEY,JSON.stringify(done));render();}
function resetDone(){if(confirm('Сбросить все отметки «собрано»?')){for(const k in done)delete done[k];localStorage.setItem(KEY,JSON.stringify(done));render();}}
function cur(){let r=DATA[TAB];const q=document.getElementById('q').value.trim().toLowerCase();if(q)r=r.filter(x=>x.article.includes(q)||x.title.toLowerCase().includes(q));return r;}
function render(){
  const r=cur();const L=document.getElementById('list');
  const total=DATA[TAB].length;const dn=DATA[TAB].filter(x=>done[x.article]).length;
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-done').textContent=dn;
  if(!r.length){L.innerHTML='<div class="empty">Ничего не найдено</div>';return;}
  L.innerHTML=r.map((x,i)=>{
    const qtyLabel=TAB==='cum'?('ЦУМ: '+x.tsum+' шт'):('Всего: '+x.qty3+' шт');
    const sizes=x.sizes.map(s=>'<span class="sz">'+s+'</span>').join('');
    return '<div class="row '+(done[x.article]?'done':'')+'" onclick="toggle(\''+x.article+'\')">'
      +'<div class="cb">'+(done[x.article]?'✓':'')+'</div>'
      +'<div class="num">'+(i+1)+'</div>'
      +'<div class="info"><div class="art">'+x.article+'</div>'
      +'<div class="nm">'+x.title+'</div>'
      +'<div class="tags"><span class="t t-cum">'+qtyLabel+'</span>'
      +'<span class="t t-price">'+x.price.toLocaleString('ru')+' ₸</span></div>'
      +'<div class="sizes">'+sizes+'</div>'
      +'<a class="lnk" href="'+x.url+'" target="_blank" onclick="event.stopPropagation()">открыть на сайте →</a></div></div>';
  }).join('');
}
function exportXlsx(){
  const r=cur();
  const aoa=[['№','Собрано','Артикул','Название',TAB==='cum'?'Кол-во ЦУМ':'Всего(3 маг)','Размеры','Цена','Ссылка']];
  r.forEach((x,i)=>aoa.push([i+1,done[x.article]?'✓':'',x.article,x.title,TAB==='cum'?x.tsum:x.qty3,x.sizes.join(' '),x.price,x.url]));
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:4},{wch:8},{wch:9},{wch:42},{wch:11},{wch:26},{wch:8},{wch:46}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,TAB==='cum'?'ЦУМ':'Др. магазины');
  XLSX.writeFile(wb,'krossy-tsum-'+TAB+'.xlsx');
}
