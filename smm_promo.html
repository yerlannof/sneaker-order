<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>СММ: скидки перед 1+1=3</title><style>
body{font-family:-apple-system,Inter,sans-serif;background:#f6f7f9;margin:0;padding:10px;color:#111}
h1{font-size:18px;margin:4px 0}.sub{color:#666;font-size:12px;margin-bottom:8px}
.bar{position:sticky;top:0;background:#f6f7f9;padding:6px 0;z-index:10;display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 13px;border-radius:20px;border:1px solid #d1d5db;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.tab.active{background:#111;color:#fff;border-color:#111}
.q{flex:1;min-width:140px;padding:8px 12px;border:1px solid #d1d5db;border-radius:20px;font-size:13px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0;padding:10px;display:flex;gap:10px}
.card.rm{background:#fef2f2;border-color:#fca5a5}
.ph{width:82px;height:82px;object-fit:cover;border-radius:8px;flex-shrink:0}
.noph{width:82px;height:82px;border-radius:8px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;flex-shrink:0}
.nm{font-weight:700;font-size:13px;line-height:1.2}.art{color:#0a7;font-size:12px;font-weight:600}
.px{margin:4px 0;font-size:15px}.px s{color:#999}.px b{color:#dc2626}.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:4px}
.on{background:#fef2f2;color:#dc2626}.full{background:#f3f4f6;color:#555;font-size:14px;font-weight:700}
.sz{font-size:11px;color:#555;margin-top:3px;line-height:1.4}.sz b{color:#111}
.empty{color:#999;padding:24px;text-align:center}
</style></head><body>
<h1>📢 СММ — скидки перед акцией 1+1=3</h1>
<div class="sub" id="sub">загрузка…</div>
<div class="bar">
<button class="tab active" data-f="removed" onclick="setF('removed',this)">❌ Скидку убрали</button>
<button class="tab" data-f="sale" onclick="setF('sale',this)">🏷 На скидке</button>
<input class="q" id="q" placeholder="🔍 артикул или модель" oninput="render()">
</div>
<div id="grid"></div>
<script>
let SALE=[],REMOVED=[],PH={},F='removed';
function fmt(n){return (n||0).toLocaleString('ru-RU')}
function st(i){return 'М'+i.m+' Ц'+i.t+' А'+i.a}
async function load(){
  const d=await (await fetch('smm_promo_lite.json')).json();
  SALE=d.on_sale;REMOVED=d.removed;PH=await (await fetch('smm_promo_photos.json')).json();
  render();
}
function setF(f,b){F=f;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');render()}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  let base = F==='removed'?REMOVED:SALE;
  let list=base.filter(i=>!q||i.name.toLowerCase().includes(q)||String(i.article).toLowerCase().includes(q));
  document.getElementById('sub').innerHTML = F==='removed'
    ? '❌ Скидку УБРАЛИ (полная цена, НЕ постить как скидку): <b>'+REMOVED.length+'</b>'
    : '🏷 Ещё НА СКИДКЕ (можно постить): <b>'+SALE.length+'</b>';
  document.getElementById('grid').innerHTML = list.length? list.map(F==='removed'?cardRm:cardSale).join('') : '<div class="empty">пусто</div>';
}
function img(i){const p=PH[i.article];return p?'<img class="ph" src="data:image/jpeg;base64,'+p+'">':'<div class="noph">'+i.article+'</div>'}
function szrow(i){let r='';if(i.szM)r+='<div class="sz"><b>Мск:</b> '+i.szM+'</div>';if(i.szC)r+='<div class="sz"><b>ЦУМ:</b> '+i.szC+'</div>';if(i.szA)r+='<div class="sz"><b>Аружан:</b> '+i.szA+'</div>';return r}
function cardSale(i){
  return '<div class="card">'+img(i)+'<div><div class="nm">'+i.name+'</div><div class="art">'+i.article+'</div>'+
    '<div class="px"><s>'+fmt(i.orig)+'</s> → <b>'+fmt(i.price)+' ₸</b><span class="badge on">−'+i.disc+'%</span></div>'+
    szrow(i)+'</div></div>';
}
function cardRm(i){
  return '<div class="card rm">'+img(i)+'<div><div class="nm">'+i.name+'</div><div class="art">'+i.article+'</div>'+
    '<div class="px"><span class="full">'+fmt(i.price)+' ₸ (полная, скидка убрана)</span></div>'+
    '<div class="sz">остаток: М'+i.m+' Ц'+i.t+' А'+i.a+'</div></div></div>';
}
load();
</script></body></html>
