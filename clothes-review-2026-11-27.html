<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Одежда: скорость и скидки</title>
<style>
/* Телефон в первую очередь: липкая шапка (статус сохранения, вкладки), ниже карточки «фото — факты — почему — кнопки скидки». Без внешних шрифтов и скриптов. */
:root{--bg:#F3F5F6;--surface:#FFFFFF;--sunk:#E9EDF0;--ink:#16212B;--muted:#5A6874;--line:#D8DFE4;--accent:#0B6B6B;--accent-soft:#DCEDED;
--good:#1B7A4B;--good-soft:#DFF1E7;--warn:#A86200;--warn-soft:#FBEBCF;--bad:#B03327;--bad-soft:#F8E0DC;--cold:#2A5FB0;--cold-soft:#DEE8F8;--bar:#9FB4C0;--bar-hi:#0B6B6B;
--text:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#10171D;--surface:#182129;--sunk:#202B34;--ink:#E7EDF1;--muted:#97A5B0;--line:#2C3944;--accent:#4FC2BE;--accent-soft:#17383A;
--good:#5CC98F;--good-soft:#173527;--warn:#E5A84A;--warn-soft:#3A2C12;--bad:#F0867A;--bad-soft:#3D1D19;--cold:#7FB0F5;--cold-soft:#1B2C47;--bar:#4A5D6A;--bar-hi:#4FC2BE;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
b,.n{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.in{max-width:860px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{font-size:20px;line-height:1.15;margin:0;font-weight:750}
#sync{font-size:12.5px;color:var(--good);text-align:right;flex:0 0 auto}
#sync.error{color:var(--bad)}
#retry{font:inherit;font-size:13px;margin:6px 0 0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#picked{font-size:13px;color:var(--muted);margin:3px 0 8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:14.5px;font-weight:600;white-space:nowrap;padding:9px 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab span{font-weight:500;color:var(--muted)}
main{max-width:860px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-right,0px)) 80px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.note{background:var(--accent-soft);border-radius:12px;padding:11px 13px;font-size:14px}
.note p{margin:0 0 6px}.note p:last-child{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bulk button{font:inherit;font-size:13.5px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.bulk span{font-size:13px;color:var(--muted)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.card.done{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ph{padding:0;border:0;background:#fff;border-radius:10px;width:112px;height:112px;overflow:hidden;cursor:zoom-in;display:block}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph.none{background:var(--sunk);cursor:default}
.t{font-weight:650;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.a{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.a a{color:var(--accent);text-decoration:none;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.cold{background:var(--cold-soft);color:var(--cold)}
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 14px;font-size:13.5px;color:var(--muted)}
.facts div{min-width:0}
.facts b{color:var(--ink);font-weight:600}
.chart{grid-column:1/-1}
.chart .cap{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:58px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;background:var(--bar);border-radius:3px 3px 0 0;min-height:1px}
.bar.sp i{background:var(--bar-hi)}
.bar em{font-style:normal;font-size:10.5px;color:var(--ink);line-height:1.2}
.bar{position:relative}.bar s{position:absolute;top:-4px;bottom:0;width:2px;margin-left:-1px;background:var(--warn);text-decoration:none}
.arr{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10.5px;color:var(--warn);font-weight:700;min-height:14px;position:relative}.arr span{position:relative;height:14px}.arr b{position:absolute;transform:translateX(-50%);white-space:nowrap}
.chart .cap s{display:inline-block;width:2px;height:11px;background:var(--warn);vertical-align:-1px;margin:0 3px}
.mon{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10.5px;color:var(--muted);text-align:center}
.why{grid-column:1/-1;font-size:13.5px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.why b{color:var(--ink)}
.why ul{margin:4px 0 0;padding-left:18px}
.pick{grid-column:1/-1;border-top:1px solid var(--line);margin:2px -10px -10px;padding:10px 12px 12px;border-radius:0 0 13px 13px}
.card.done .pick{background:var(--accent-soft)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{font:inherit;font-size:14px;font-weight:600;min-width:52px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative}
.step.rec{border:2px dashed var(--accent)}
.step[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.step.low{color:var(--bad)}
.step[aria-pressed="true"].low{background:var(--bad);border-color:var(--bad);color:#fff}
.step:disabled{opacity:.5;cursor:default}
.result{font-size:13.5px;margin-top:7px;color:var(--muted)}
.result b{color:var(--ink)}
.result .bad{color:var(--bad);font-weight:600}
.sum{display:flex;flex-direction:column;gap:10px}
.sum h2{font-size:16px;margin:6px 0 0}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.kpi b{display:block;font-size:19px;line-height:1.2}.kpi span{font-size:12.5px;color:var(--muted)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.grp .gt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;color:var(--ink);font-weight:650;font-size:15px}
.grp .gt span{font-weight:600;font-size:13px;white-space:nowrap}
.grp b{color:var(--ink);font-weight:600}
.grp .ln{margin-top:4px}
.meter{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:7px;display:flex}
.meter i{display:block;height:100%}.meter .d{background:var(--warn)}.meter .r{background:var(--bad)}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wk .cap{font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:4px}
.wk .bars{grid-template-columns:repeat(12,1fr);height:46px}
.wk .mon{grid-template-columns:repeat(12,1fr)}
.legend{font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 4px 0 10px}
#empty{color:var(--muted);text-align:center;padding:30px 0}
dialog{border:0;border-radius:16px;padding:14px;max-width:min(92vw,520px);background:#fff;color:#15202A}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog img{width:100%;display:block;border-radius:10px}
dialog p{margin:8px 0 0;font-size:14px;text-align:center}
#close-photo{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(21,32,42,.75);color:#fff;font-size:16px;cursor:pointer}
.foot{color:var(--muted);font-size:12.5px;padding-top:8px}
@media (max-width:420px){.card{grid-template-columns:92px minmax(0,1fr)}.ph{width:92px;height:92px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>

    const sold = ['m', 'c', 'a'].filter(k => i.s90[k]).map(k => SN[k] + ' ' + i.s90[k]).join(', ');
    const price = i.cur_pct ? `<b>${n0(i.now)} ₸</b> (обычная ${n0(i.reg)}, уже −${i.cur_pct}%)` : `<b>${n0(i.reg)} ₸</b>`;
    const margin = i.cost ? ` · закуп ${n0(i.cost)} ₸, наценка ×${(i.now / i.cost).toFixed(1).replace('.', ',')}` : ' · закуп не указан';
    const cover = i.months !== null ? `Запаса при нынешнем темпе${i.g30 ? ' (с подарками)' : ''}: <b>${i.months >= 24 ? 'больше 2 лет' : String(i.months).replace('.', ',') + ' мес.'}</b>` : 'Запаса: <b>за месяц ничего не ушло</b>';
    const fc = i.exp !== null && i.until ? `<br>До ${esc(i.until)} без скидки уйдёт около <b>${i.exp} из ${i.q}</b>` : '';
    const arrival = i.last ? `Последний приход <b>${fmtd(i.last)}</b> (${days(i.last_age)} назад): ${i.since === null ? `всего пришло ${i.last_qty}, осталось ${i.q}` : `пришло ${i.last_qty}, с тех пор продано <b>${i.since}</b>${i.gsince ? ', подарком ' + i.gsince : ''}`}${i.first !== i.last && i.since !== null ? `<br>Первый приход ${fmtd(i.first)}, всего пришло ${i.total_in}` : ''}` : 'Приёмок в базе нет: старый остаток';
    const steps = STEPS.map(p => {
      const low = i.cost && p && priceAt(i, p) < i.cost * 1.05;
      return `<button class="step${p === i.rec ? ' rec' : ''}${low ? ' low' : ''}" data-id="${esc(i.id)}" data-p="${p}" aria-pressed="false">${p ? '−' + p + '%' : 'Не трогать'}</button>`;
    }).join('');
    return `<article class="card" id="card-${esc(i.id)}" hidden>
      <button class="ph none" data-photo="${esc(i.id)}" aria-label="Увеличить фото"><img data-a="${esc(i.id)}" alt="" loading="lazy"></button>
      <div><div class="t">${esc(i.n)}</div><div class="a"><span>арт. ${esc(i.a || '—')}</span></div><div class="tags">${tagsOf(i)}</div></div>
      <div class="facts">
        <div>Остаток <b>${pairs(i.q)}</b><br>${esc(st)}</div>
        <div>Размеры<br><b>${esc(i.sizes)}</b></div>
        <div>Продано: 7 дн <b>${i.p7}</b> · 30 дн <b>${i.p30}</b> · 90 дн <b>${i.p90}</b> · год <b>${i.p365}</b>${i.g90 ? `<br>Ушло подарком: 30 дн <b>${i.g30}</b> · 90 дн <b>${i.g90}</b>` : ''}</div>
        <div>Кто продал за 90 дн<br><b>${esc(sold || 'никто')}</b></div>
        <div>${arrival}</div>
        <div>Цена ${price}${margin}<br>${cover}${fc}</div>
      </div>
      ${chart(i)}
      <div class="why"><b>${i.rec ? 'Почему скидка' : 'Почему так'}:</b><ul>${i.why.map(w => `<li>${esc(w)}</li>`).join('')}${i.skew && !i.rec ? `<li>${esc(i.skew)}</li>` : ''}</ul></div>
      <div class="pick"><div class="steps">${steps}</div><div class="result"></div></div>
    </article>`;
  }
  function summary() {
    const T = PACKAGE.totals, mln = v => (v / 1e6).toFixed(1).replace('.', ',');
    const rec = items.filter(i => i.rec), recQ = rec.reduce((a, i) => a + i.q, 0), recM = rec.reduce((a, i) => a + i.money, 0);
    const cover = T.p30 + T.g30 ? (T.q / (T.p30 + T.g30)).toFixed(1).replace('.', ',') : '—';
    const kpi = (b, s) => `<div class="kpi"><b>${b}</b><span>${s}</span></div>`;
    let h = '';
    if (PACKAGE.points.length) h += `<h2>Главное</h2><ol class="pts">${PACKAGE.points.map(p => `<li>${p}</li>`).join('')}</ol>`;
    h += `<h2>Вся одежда</h2><div class="kpis">${kpi(n0(T.q) + ' шт', 'остаток, закуп ' + mln(T.money) + ' млн ₸')}${kpi(n0(T.p30) + ' шт', 'продано за 30 дней, ' + mln(T.rev30) + ' млн ₸')}${kpi(n0(T.g30) + ' шт', 'ушло подарком за 30 дней')}${kpi(cover + ' мес.', 'запас с учётом подарков')}${kpi(n0(recQ) + ' шт', 'предлагаю скидку, закуп ' + mln(recM) + ' млн ₸')}</div>`;
    const share = (o, k) => Math.round(100 * o[k] / Math.max(1, o.m + o.c + o.a));
    h += `<div class="grp"><div class="gt">По точкам</div>${['m', 'c', 'a'].map(k => `<div class="ln">${SN[k]}: остаток <b>${n0(T.store.q[k])} шт</b> (${share(T.store.q, k)}%), продано за 30 дней <b>${T.store.p30[k]}</b> (${share(T.store.p30, k)}%)</div>`).join('')}</div>`;
    h += '<h2>По видам одежды</h2><div class="legend">Полоска: <i style="background:var(--warn)"></i>уже со скидкой<i style="background:var(--bad)"></i>предлагаю скидку</div>';
    for (const g of PACKAGE.groups) {
      const m = g.months === null ? 'продаж нет' : (g.months >= 24 ? 'больше 2 лет' : String(g.months).replace('.', ',') + ' мес.');
      h += `<div class="grp"><div class="gt">${esc(g.label)}<span>запас ${m}</span></div>
        <div class="ln">Остаток <b>${n0(g.q)} шт</b>, ${g.models} моделей: Москва ${g.m}, ЦУМ ${g.c}, Аружан ${g.a}${g.w ? ', склад ' + g.w : ''}. Закуп ${mln(g.money)} млн ₸</div>
        <div class="ln">Продано: 7 дн <b>${g.p7}</b> · 30 дн <b>${g.p30}</b> · 90 дн <b>${g.p90}</b>${g.g30 ? ' · подарком за 30 дн <b>' + g.g30 + '</b>' : ''}</div>
        <div class="ln">Уже со скидкой ${n0(g.disc_q)} шт · предлагаю скидку <b>${n0(g.rec_q)} шт</b> (${g.rec_models} мод.) · ничего не ушло за 90 дней: ${n0(g.dead_q)} шт</div>
        <div class="meter"><i class="d" style="width:${(100 * g.disc_q / g.q).toFixed(1)}%"></i><i class="r" style="width:${(100 * Math.max(0, Math.min(g.q - g.disc_q, g.rec_q)) / g.q).toFixed(1)}%"></i></div></div>`;
    }
    h += '<h2>Продажи по неделям, 12 недель</h2>';
    const W = [['winter', 'Тёплые куртки и пуховики'], ['demi', 'Худи, костюмы, ветровки'], ['allseason', 'Джинсы, брюки, лонгсливы'], ['summer', 'Футболки, шорты']];
    for (const [k, label] of W) {
      const v = PACKAGE.weekly[k], gv = PACKAGE.weekly_gifts[k], mx = Math.max(1, ...v);
      h += `<div class="wk"><div class="cap">${label}</div><div class="legend" style="margin:0 0 6px">Последние 4 недели: продано <b>${v.slice(-4).join(' → ')}</b>, подарком ${gv.slice(-4).join(' → ')}</div><div class="bars">${v.map((x, j) => `<div class="bar${j === 11 ? ' sp' : ''}"><em>${x || ''}</em><i style="height:${Math.round(100 * x / mx)}%"></i></div>`).join('')}</div></div>`;
    }
    h += `<p class="foot">Последняя неделя справа. Продажи платные, без подарков акции.</p>`;
    $('summary').innerHTML = h;
  }
  summary();
  $('tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t.id}">${esc(t.title)} <span>${t.id === 'sum' ? '' : items.filter(i => i.tab === t.id).length}</span></button>`).join('');
  $('list').innerHTML = items.map(card).join('');
  $('foot').textContent = `Остатки и цены МойСклада на ${PACKAGE.asof}, продажи по ${PACKAGE.sales_to} включительно. Один цвет считается отдельной моделью. Подарки акции в продажи не входят. Аксессуары, носки и обувь сюда не входят.`;
  $('list').addEventListener('click', e => {
    const b = e.target.closest('.step');
    if (b) {
      const id = b.dataset.id, p = +b.dataset.p;
      set(id, value(id) === p ? null : p); persist(); draw(); status('Сохраняем…'); sync(); return;
    }
    const a = e.target.closest('[data-photo]')?.dataset.photo; if (!a || !PHOTOS[a]) return;
    $('large-photo').src = 'data:image/jpeg;base64,' + PHOTOS[a]; $('photo-label').textContent = byId[a]?.n + ' · арт. ' + (byId[a]?.a || '—'); $('photo-dialog').showModal();
  });
  $('close-photo').onclick = () => $('photo-dialog').close();
  $('photo-dialog').onclick = e => {if (e.target === $('photo-dialog')) $('photo-dialog').close();};
  $('tabs').addEventListener('click', e => {const t = e.target.closest('[data-tab]')?.dataset.tab; if (!t) return; tab = t; persist(); draw(); window.scrollTo({top: 0});});
  $('filters').addEventListener('click', e => {const f = e.target.closest('[data-f]')?.dataset.f; if (!f) return; filter[tab] = f; draw();});
  $('accept').onclick = () => {for (const i of items) if (i.tab === tab && passes(i) && value(i.id) === null) set(i.id, i.rec); persist(); draw(); status('Сохраняем…'); sync();};
  $('retry').onclick = sync;
  window.addEventListener('online', sync);
  window.addEventListener('beforeunload', e => {if (Object.keys(pending).length) {e.preventDefault(); e.returnValue = '';}});
  document.addEventListener('visibilitychange', () => {if (!document.hidden) sync();});
  setInterval(() => {if (!document.hidden) sync();}, 20000);
  draw(); sync();
  fetch(CONFIG.photos, {cache: 'force-cache'}).then(r => r.ok ? r.json() : {}).then(p => {
    PHOTOS = p;
    document.querySelectorAll('img[data-a]').forEach(img => {const b = p[img.dataset.a]; if (b) {img.src = 'data:image/jpeg;base64,' + b; img.parentElement.classList.remove('none');}});
  }).catch(() => {});
})();
</script></body></html>
