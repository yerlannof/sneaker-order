<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сбор на фотосет — ЦУМ</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#16181d; --mut:#6b7280; --line:#e5e7eb; --ok:#16a34a; --top:#b45309; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:16px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:70px; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; }
  header h1 { font-size:17px; }
  header .sub { color:var(--mut); font-size:13px; margin-top:2px; }
  #bar { height:8px; background:var(--line); border-radius:99px; margin-top:8px; overflow:hidden; }
  #fill { height:100%; width:0%; background:var(--ok); transition:width .25s; }
  #count { font-weight:700; }
  .grp { margin:18px 12px 6px; font-size:14px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; }
  .grp.top { color:var(--top); }
  .card { background:var(--card); margin:6px 12px; border:1px solid var(--line); border-radius:12px; }
  label.row { display:flex; gap:12px; padding:12px 14px; align-items:flex-start; cursor:pointer; }
  label.row input { width:24px; height:24px; margin-top:3px; flex:none; accent-color:var(--ok); }
  .art { font-weight:800; font-variant-numeric:tabular-nums; }
  .nm { margin-left:6px; }
  .sz { color:var(--mut); font-size:14px; margin-top:2px; }
  .note { color:var(--top); font-size:13px; margin-top:2px; }
  .done .art, .done .nm { text-decoration:line-through; color:var(--mut); }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; }
  footer button { border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:8px 14px; font-size:14px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>📸 Сбор коробок на фотосет — ЦУМ</h1>
  <div class="sub">17.08.2026 · 51 модель · сверху — самые важные · размеры = что есть в ЦУМе (брать одну любую пару)</div>
  <div id="bar"><div id="fill"></div></div>
</header>
<div id="list"></div>
<footer>
  <div>Собрано: <span id="count">0 / 51</span></div>
  <button onclick="if(confirm('Сбросить все галочки?')){localStorage.removeItem(KEY);render();}">Сброс</button>
</footer>
<script>
const KEY = 'shoot_tsum_2026-08-17';
const GROUPS = [
 ["🥇 ТОП — собирать первыми", "top", [
  ["202875","Vans Knu Skool Black White","36, 37, 39, 40, 42"],
  ["202870","Nike V2K Run Summit White Silver","39"],
  ["202885","Christian Louboutin Louis Junior Black Suede","40, 41, 44"],
  ["202880","Nike V2K Run White Pink Metallic","36, 37, 38, 40"],
  ["202890","Nike Air Max Plus Drift White Blue","40, 41, 43"],
  ["202910","Maison Margiela Replica GAT White Grey","40, 41, 42, 44"],
  ["202872","Christian Louboutin Louis Junior Navy Suede","41, 42, 43"],
  ["202909","Maison Margiela Replica GAT Total Black","40, 41, 43"],
  ["202861","Adidas Adilette Slides White","45"],
  ["202883","Nike Air Force 1 Low Olive Suede","36–46 (вся сетка)"],
  ["202886","Nike Air Force 1 Low Wheat Flax Suede","36–46 (вся сетка)"],
  ["202891","Nike Air Force 1 Low Dark Grey Suede","36–46 (вся сетка)"]
 ]],
 ["📦 Основная волна", "", [
  ["202869","Nike AJ1 Low Travis Scott Sail Pink","36–44"],
  ["202917","Zara Court Oversized Black Pebbled White Sole","40–45"],
  ["202894","Nike V2K Run Black White Silver","40–44"],
  ["202898","Nike Dunk Low Cream Tan Brown Suede","40–44"],
  ["202887","Hugo Boss Titanium Runner Black Grey","40–43"],
  ["202874","Nike SB Dunk Low White Black Teal","36–41"],
  ["202878","Nike Blazer Low Platform White Black","36–40"],
  ["202893","Nike Air Max Burbuja Silver Grey","40–44"],
  ["202900","Nike SB Dunk Low White Taupe Suede Red Tab","40–43"],
  ["202873","Nike AJ1 Low Travis Scott Reverse Mocha 2","36–44"],
  ["202888","Lacoste L003 Neo White Silver","40–44"],
  ["202897","Nike Dunk Low Grey Black Panda","40–44"],
  ["202876","Converse Chuck Taylor All Star Mono Black","36–45"],
  ["202906","Ecco Sneaker Black Tan Heel","40–44"],
  ["202895","Nike Air Max 2015 Triple Black","41–44"],
  ["202915","Court Sneaker Navy Paris","40–45"],
  ["202882","Nike Air Max 90 Cream Beige","36–41"],
  ["202892","Nike Air Max 90 Green","40–44"],
  ["202905","Ecco Sneaker Total Black Nubuck","40–44"],
  ["202908","Nike AJ1 Low OG Black Toe","40–44"]
 ]],
 ["➖ Средние", "", [
  ["202855","Birkenstock Boston Cream Suede","36, 37, 38"],
  ["202881","Nike AJ1 Low Travis Scott Black Olive","36, 40–44"],
  ["202903","Women Platform Sneaker Beige Cream Glitter","36–41"],
  ["202914","Zara Court Oversized Black Smooth","40–45"],
  ["202916","Zara Court Oversized Black Pebbled","40–45"],
  ["202904","Ecco Sneaker Navy Nubuck","40–44"],
  ["202907","Nike Cortez Nylon Brown Rice White","36–40"]
 ]],
 ["⚫ Если останется время", "", [
  ["202546","Nike Zoom Vomero Roam Street Armor","36","новинка-досорт"],
  ["202902","Women Platform Sneaker Silver Grey Glitter","36–41"],
  ["202879","Nike AJ1 Low Travis Scott Medium Olive","40–44"],
  ["202901","Nike SB Dunk Low Triple Black","40–44"],
  ["202912","Moncler Low Black Gum","40–44"],
  ["201855","Nike Air Max 95 White","36"],
  ["201399","Adidas Stan Smith White Green","40"],
  ["201746","Nike SB Dunk Low Retro White Black Panda","36"],
  ["201753","Nike Zoom X Streakfly White","36"],
  ["201808","Nike AJ1 Low White Wolf Grey","40"],
  ["201922","Nike Blazer Low '77 Vintage White Black","36"],
  ["201995","Nike Zoom Winflo 8 Mid GTX Black","39"]
 ]]
];
const TOTAL = GROUPS.reduce((s,g)=>s+g[2].length,0);
function state(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){ return {}; } }
function render(){
  const st = state(), root = document.getElementById('list');
  root.innerHTML = '';
  let done = 0;
  for (const [title, cls, items] of GROUPS){
    const h = document.createElement('div'); h.className = 'grp ' + cls; h.textContent = title; root.appendChild(h);
    const card = document.createElement('div'); card.className = 'card';
    for (const [art, name, sizes, note] of items){
      const on = !!st[art]; if (on) done++;
      const l = document.createElement('label'); l.className = 'row' + (on ? ' done' : '');
      l.innerHTML = `<input type="checkbox" ${on?'checked':''}><div><div><span class="art">${art}</span><span class="nm">${name}</span></div><div class="sz">размеры: ${sizes}</div>${note?`<div class="note">⚠ ${note}</div>`:''}</div>`;
      l.querySelector('input').addEventListener('change', e => { const s = state(); if (e.target.checked) s[art] = 1; else delete s[art]; localStorage.setItem(KEY, JSON.stringify(s)); render(); });
      card.appendChild(l);
    }
    root.appendChild(card);
  }
  document.getElementById('count').textContent = done + ' / ' + TOTAL;
  document.getElementById('fill').style.width = (100*done/TOTAL) + '%';
}
render();
</script>
</body>
</html>
