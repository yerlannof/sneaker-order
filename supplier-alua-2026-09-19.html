<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f5ef"><title>Заказ обуви · 19 сентября</title><style>:root{color-scheme:light;--ink:#173c2e;--muted:#46584d;--bg:#f3f5ef;--line:#c9d4c6;--green:#e6f0dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
header{max-width:1040px;margin:auto;padding:26px 20px 20px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:18px;color:var(--muted);margin:0 0 6px}
h1{font-size:34px;line-height:1.2;margin:0;letter-spacing:-.6px}
#total{font-size:20px;color:var(--muted)}
.progress-line{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px;margin-top:24px}
.progress-line strong{font-size:23px}
#sync{font-size:18px;color:var(--muted)}
#sync.error{color:#9c2f1d}
progress{display:block;width:100%;height:9px;margin:12px 0 14px;appearance:none;border:0;border-radius:6px;background:#d6dfd0}
progress::-webkit-progress-bar{background:#d6dfd0;border-radius:6px}
progress::-webkit-progress-value{background:var(--ink);border-radius:6px}
progress::-moz-progress-bar{background:var(--ink);border-radius:6px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.filter{display:flex;gap:13px;align-items:center;font-size:21px;min-height:60px;cursor:pointer}
input[type=checkbox]{width:32px;height:32px;accent-color:var(--ink);margin:0;flex-shrink:0;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
#retry{font-size:18px;border:2px solid var(--line);border-radius:10px;background:white;padding:12px 16px;min-height:52px}
main{max-width:1040px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:24px}
article{border:2px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;min-width:0}
article.done{border-color:#527744}
.card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:17px 18px 0;font-size:18px;color:var(--muted)}
.model-no{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.photo{border:0;background:#fff;display:block;width:100%;padding:12px 20px 0}
.photo img{display:block;width:100%;height:270px;object-fit:contain}
.photo-hint{display:block;font-size:18px;color:var(--muted);text-align:center;padding:8px 0 16px}
.sizes{padding:0 16px}
.size{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:74px;border-top:1px solid var(--line);padding:12px 14px;font-variant-numeric:tabular-nums}
.size:nth-child(odd){background:#f1f5eb}
.size-name{display:flex;align-items:baseline;gap:10px;font-size:19px;color:var(--ink)}
.size-name strong{font-size:36px;line-height:1.15;letter-spacing:-.6px}
.size-qty{font-size:30px;font-weight:750;white-space:nowrap;color:#122d22}
.qty-visual{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:2px 0 5px}
.pair-marks{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:126px}
.pair-dot{display:inline-block;width:16px;height:16px;flex-shrink:0;border-radius:50%;background:#173c2e}
.pair-legend{display:flex;align-items:center;gap:10px;padding:3px 16px 13px;font-size:18px;color:var(--muted)}
.model-total{display:flex;justify-content:space-between;align-items:baseline;padding:18px 28px 20px;gap:12px;font-size:22px}
.model-total strong{font-size:28px;white-space:nowrap}
.done-label{display:flex;gap:16px;align-items:center;padding:20px 24px;border-top:2px solid var(--line);background:#f1f5eb;font-size:26px;font-weight:750;min-height:82px;cursor:pointer}
.done-label input{width:36px;height:36px}
.done .done-label{background:var(--ink);color:white}
.done .done-label input{accent-color:white}
article[hidden],#empty[hidden],[hidden]{display:none!important}
#empty{text-align:center;padding:30px;font-size:26px}
dialog{border:0;border-radius:18px;padding:65px 14px 14px;max-width:min(94vw,800px);color:var(--ink)}
dialog::backdrop{background:#13231ee6}
dialog img{display:block;width:100%;max-height:70vh;object-fit:contain}
dialog p{text-align:center;font-size:21px}
#close-photo{position:absolute;right:8px;top:6px;width:54px;height:54px;border:0;background:transparent;font-size:30px}
input:focus-visible,button:focus-visible{outline:3px solid #b57d13;outline-offset:4px}
@media(max-width:760px){header{padding:22px 17px 16px}.heading{display:block}#total{display:block;margin-top:12px}main{grid-template-columns:1fr;gap:26px;padding:0 12px calc(28px + env(safe-area-inset-bottom))}.progress-line{display:block}#sync{display:block;margin-top:5px}.photo img{height:250px}}
@media(max-width:360px){.size{padding:12px 9px;gap:8px}.size-name{gap:6px;font-size:18px}.size-name strong{font-size:32px}.size-qty{font-size:27px}.sizes{padding:0 10px}.card-head{padding:16px 14px 0}.filter{font-size:19px}.model-total{padding:18px;font-size:20px}}
@media(max-width:360px){.pair-marks{gap:5px;max-width:109px}.pair-dot{width:14px;height:14px}.pair-legend{padding-left:14px;gap:8px}}
@media print{.toolbar,#sync,dialog,.photo-hint{display:none}main{display:block}article{break-inside:avoid;margin:0 0 18px}.photo img{height:180px}.size{min-height:44px;padding:5px 14px}}
</style></head>
